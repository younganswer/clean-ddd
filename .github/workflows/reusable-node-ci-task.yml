name: reusable-node-ci-task

on:
    workflow_call:
        inputs:
            working_directory:
                description: Working directory for shell commands
                required: false
                type: string
                default: src
            checkout_ref:
                description: Optional git ref to checkout
                required: false
                type: string
                default: ""
            node_version:
                description: Node.js version
                required: false
                type: string
                default: "22"
            pnpm_version:
                description: pnpm version
                required: false
                type: string
                default: "9.15.5"
            run_script:
                description: Script to run after dependency setup
                required: true
                type: string
            timeout_minutes:
                description: Job timeout minutes
                required: false
                type: number
                default: 60

permissions:
    contents: read

jobs:
    run:
        runs-on: ubuntu-latest
        timeout-minutes: ${{ inputs.timeout_minutes }}
        defaults:
            run:
                working-directory: ${{ inputs.working_directory }}
        steps:
            - name: Setup Node + pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  checkout_ref: ${{ inputs.checkout_ref }}
                  node_version: ${{ inputs.node_version }}
                  pnpm_version: ${{ inputs.pnpm_version }}
                  working_directory: ${{ inputs.working_directory }}

            - name: Run script
              shell: bash
              run: ${{ inputs.run_script }}
