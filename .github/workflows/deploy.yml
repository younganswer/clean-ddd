name: clean-ddd-deploy

on:
    workflow_dispatch:
        inputs:
            target_env:
                description: GitHub Environment name
                type: choice
                required: true
                default: dev
                options:
                    - dev
                    - prod
    workflow_run:
        workflows: [clean-ddd-ci]
        types:
            - completed

permissions:
    actions: write
    contents: write
    id-token: write

concurrency:
    group: deploy-${{ github.ref }}-${{ github.event.inputs.target_env || 'prod' }}
    cancel-in-progress: false

jobs:
    deploy:
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
        uses: ./.github/workflows/reusable-node-workspace-task.yml
        with:
            environment_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'prod' }}
            checkout_ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            configure_aws: true
            setup_sam: true
            run_script: |
                TARGET_ENV="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_env || 'prod' }}"
                chmod +x infra/scripts/deploy-fullstack.sh
                infra/scripts/deploy-fullstack.sh "$TARGET_ENV" "${{ github.repository }}"
        secrets: inherit
