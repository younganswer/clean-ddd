name: clean-ddd-ci

on:
    pull_request:
    push:
        branches: [main]

jobs:
    validate:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable Corepack
              run: corepack enable

            - name: Activate pnpm
              run: corepack prepare pnpm@9.15.5 --activate

            - name: Verify pnpm
              run: pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test
