name: clean-ddd-ci

on:
    pull_request:
    push:
        branches: [main]

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable Corepack
              run: corepack enable

            - name: Activate pnpm
              run: corepack prepare pnpm@9.15.5 --activate

            - name: Verify pnpm
              run: pnpm --version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Backend lint
              run: pnpm --filter api lint

            - name: Backend typecheck
              run: pnpm --filter api typecheck

            - name: Backend build
              run: pnpm --filter api build

            - name: Backend test
              run: pnpm --filter api test

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Enable Corepack
              run: corepack enable

            - name: Activate pnpm
              run: corepack prepare pnpm@9.15.5 --activate

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Frontend lint
              run: pnpm --filter admin lint

            - name: Frontend typecheck
              run: pnpm --filter admin typecheck

            - name: Frontend build
              run: pnpm --filter admin build

            - name: Frontend test
              run: pnpm --filter admin test
