name: setup-node-pnpm
description: Prepare Node.js + pnpm dependencies

inputs:
    node_version:
        description: Node.js version
        required: false
        default: "22"
    pnpm_version:
        description: pnpm version
        required: false
        default: "9.15.5"
    working_directory:
        description: Working directory for dependency install
        required: false
        default: src

runs:
    using: composite
    steps:
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
              node-version: ${{ inputs.node_version }}

        - name: Enable Corepack
          shell: bash
          run: corepack enable

        - name: Activate pnpm
          shell: bash
          run: corepack prepare pnpm@${{ inputs.pnpm_version }} --activate

        - name: Install dependencies
          shell: bash
          working-directory: ${{ inputs.working_directory }}
          run: pnpm install --frozen-lockfile
