services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend-api}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_HOST: ${FRONTEND_HOST:-frontend}
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-10m}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-300s}
    depends_on:
      - frontend
      - backend-api

  frontend:
    build:
      context: ../..
      dockerfile: service/frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      PORT: ${FRONTEND_PORT:-8080}
    expose:
      - "${FRONTEND_PORT:-8080}"

  backend-api:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "true"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      OUTBOX_CRON_ENABLED: "false"
      OUTBOX_POLLING_ENABLED: "false"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  backend-cron:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "false"
      OUTBOX_CRON_ENABLED: "true"
      OUTBOX_POLLING_ENABLED: "false"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  backend-queue:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    environment:
      NODE_ENV: ${NODE_ENV:-dev}
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "false"
      OUTBOX_CRON_ENABLED: "false"
      OUTBOX_POLLING_ENABLED: "true"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
