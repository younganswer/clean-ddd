AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Worker lambda resources for clean-ddd

Globals:
  Function:
    MemorySize: 512
    Timeout: 30
    Tags:
      Project: !Ref ProjectName
      Environment: !Ref EnvironmentName
    Architectures:
      - x86_64
    Environment:
      Variables:
        DATABASE_URL_POOLED: !Ref DatabaseUrlPooled
        DATABASE_URL_DIRECT: !Ref DatabaseUrlDirect
        PGSSLMODE: require
        DB_FORCE_SSL: true
        SQS_OUTBOX_QUEUE_URL: !Ref OutboxQueueUrl
        AVATAR_REPOSITORY_BACKEND: !Ref AvatarRepositoryBackend
        DYNAMODB_AVATAR_TABLE: !Ref DynamoDbAvatarTable

Parameters:
  ProjectName:
    Type: String
  EnvironmentName:
    Type: String
  DatabaseUrlPooled:
    Type: String
    NoEcho: true
  DatabaseUrlDirect:
    Type: String
    NoEcho: true
  AvatarRepositoryBackend:
    Type: String
    AllowedValues:
      - mongo
      - dynamodb
  DynamoDbAvatarTable:
    Type: String
  OutboxQueueArn:
    Type: String
  OutboxQueueName:
    Type: String
  OutboxQueueUrl:
    Type: String
  OutboxDispatchScheduleExpression:
    Type: String
    Default: rate(1 minute)
  OutboxConsumerReservedConcurrency:
    Type: Number
    Default: 5
  OutboxConsumerLockTimeoutMs:
    Type: Number
    Default: 120000
  OutboxDispatchReservedConcurrency:
    Type: Number
    Default: 2
  WorkerLogRetentionDays:
    Type: Number
    Default: 14

Resources:
  OutboxConsumerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../../..
      Dockerfile: service/backend/Dockerfile.lambda
      DockerTag: outbox-consumer-function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-WorkerStack-outbox-consumer"
      PackageType: Image
      ImageConfig:
        Command:
          - dist/src/lib/lambda/sqs/outbox.handler
      ReservedConcurrentExecutions: !Ref OutboxConsumerReservedConcurrency
      Environment:
        Variables:
          OUTBOX_CRON_ENABLED: false
          OUTBOX_ENQUEUE_STRICT: true
          OUTBOX_CONSUMER_LOCK_TIMEOUT_MS: !Ref OutboxConsumerLockTimeoutMs
      Policies:
        - SQSPollerPolicy:
            QueueName: !Ref OutboxQueueName
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDbAvatarTable
      Events:
        OutboxQueue:
          Type: SQS
          Properties:
            Queue: !Ref OutboxQueueArn
            BatchSize: 1

  OutboxConsumerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-WorkerStack-outbox-consumer"
      RetentionInDays: !Ref WorkerLogRetentionDays

  OutboxDispatchSchedulerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: ../../..
      Dockerfile: service/backend/Dockerfile.lambda
      DockerTag: outbox-dispatch-scheduler-function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-WorkerStack-outbox-dispatch"
      PackageType: Image
      ImageConfig:
        Command:
          - dist/src/lib/lambda/schedule/outbox-dispatch.handler
      ReservedConcurrentExecutions: !Ref OutboxDispatchReservedConcurrency
      Environment:
        Variables:
          OUTBOX_CRON_ENABLED: false
          OUTBOX_DISPATCH_BATCH_SIZE: 10
          OUTBOX_ENQUEUE_STRICT: true
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !Ref OutboxQueueName
        - DynamoDBReadPolicy:
            TableName: !Ref DynamoDbAvatarTable
      Events:
        OutboxDispatchSchedule:
          Type: Schedule
          Properties:
            Schedule: !Ref OutboxDispatchScheduleExpression
            Name: !Sub "${ProjectName}-${EnvironmentName}-OutboxDispatchSchedule"
            Enabled: true

  OutboxDispatchSchedulerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-WorkerStack-outbox-dispatch"
      RetentionInDays: !Ref WorkerLogRetentionDays

Outputs:
  OutboxConsumerFunctionName:
    Value: !Ref OutboxConsumerFunction
  OutboxConsumerFunctionArn:
    Value: !GetAtt OutboxConsumerFunction.Arn
  OutboxDispatchSchedulerFunctionName:
    Value: !Ref OutboxDispatchSchedulerFunction
  OutboxDispatchSchedulerFunctionArn:
    Value: !GetAtt OutboxDispatchSchedulerFunction.Arn
