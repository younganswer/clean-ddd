AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: clean-ddd (API Gateway + Lambda + SQS FIFO) minimal stack

Globals:
    Function:
        Runtime: nodejs22.x
        MemorySize: 512
        Timeout: 10
        Architectures:
            - arm64
        Environment:
            Variables:
                AWS_REGION: !Ref AWS::Region

Parameters:
    DatabaseUrlPooled:
        Type: String
        NoEcho: true
        Description: Neon pooled connection string
    DatabaseUrlDirect:
        Type: String
        NoEcho: true
        Description: Neon direct connection string
    AvatarRepositoryBackend:
        Type: String
        Default: dynamodb
        AllowedValues:
            - mongo
            - dynamodb
        Description: Avatar repository backend selector
    DynamoDbAvatarTable:
        Type: String
        Default: clean-ddd-avatar
        Description: DynamoDB table name for avatar documents
    OutboxDispatchScheduleExpression:
        Type: String
        Default: rate(1 minute)
        Description: EventBridge schedule expression for outbox dispatch lambda

Resources:
    AvatarTable:
        Type: AWS::DynamoDB::Table
        Properties:
            TableName: !Ref DynamoDbAvatarTable
            BillingMode: PAY_PER_REQUEST
            AttributeDefinitions:
                - AttributeName: avatarId
                  AttributeType: S
            KeySchema:
                - AttributeName: avatarId
                  KeyType: HASH

    OutboxDispatchDlq:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: OutboxDispatchDlq.fifo
            FifoQueue: true
            ContentBasedDeduplication: false

    OutboxDispatchQueue:
        Type: AWS::SQS::Queue
        Properties:
            QueueName: OutboxDispatchQueue.fifo
            FifoQueue: true
            ContentBasedDeduplication: false
            RedrivePolicy:
                deadLetterTargetArn: !GetAtt OutboxDispatchDlq.Arn
                maxReceiveCount: 5

    HttpApi:
        Type: AWS::Serverless::HttpApi
        Properties:
            StageName: v1

    ApiFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../../service/backend
            Handler: dist/lib/lambda/http.handler.handler
            Environment:
                Variables:
                    DATABASE_URL_POOLED: !Ref DatabaseUrlPooled
                    DATABASE_URL_DIRECT: !Ref DatabaseUrlDirect
                    SQS_OUTBOX_QUEUE_URL: !Ref OutboxDispatchQueue
                    AVATAR_REPOSITORY_BACKEND: !Ref AvatarRepositoryBackend
                    DYNAMODB_AVATAR_TABLE: !Ref DynamoDbAvatarTable
                    OUTBOX_CRON_ENABLED: false
            Policies:
                - SQSSendMessagePolicy:
                      QueueName: !GetAtt OutboxDispatchQueue.QueueName
                - DynamoDBCrudPolicy:
                      TableName: !Ref DynamoDbAvatarTable
            Events:
                Api:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref HttpApi
                        Path: /{proxy+}
                        Method: ANY

    OutboxConsumerFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../../service/backend
            Handler: dist/lib/lambda/sqs/outbox.handler.handler
            Timeout: 30
            Environment:
                Variables:
                    DATABASE_URL_POOLED: !Ref DatabaseUrlPooled
                    DATABASE_URL_DIRECT: !Ref DatabaseUrlDirect
                    SQS_OUTBOX_QUEUE_URL: !Ref OutboxDispatchQueue
                    AVATAR_REPOSITORY_BACKEND: !Ref AvatarRepositoryBackend
                    DYNAMODB_AVATAR_TABLE: !Ref DynamoDbAvatarTable
                    OUTBOX_CRON_ENABLED: false
            Policies:
                - SQSPollerPolicy:
                      QueueName: !GetAtt OutboxDispatchQueue.QueueName
                - DynamoDBReadPolicy:
                      TableName: !Ref DynamoDbAvatarTable
            Events:
                OutboxQueue:
                    Type: SQS
                    Properties:
                        Queue: !GetAtt OutboxDispatchQueue.Arn
                        BatchSize: 1

    OutboxDispatchSchedulerFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: ../../service/backend
            Handler: dist/lib/lambda/schedule/outbox-dispatch.handler.handler
            Timeout: 30
            Environment:
                Variables:
                    DATABASE_URL_POOLED: !Ref DatabaseUrlPooled
                    DATABASE_URL_DIRECT: !Ref DatabaseUrlDirect
                    SQS_OUTBOX_QUEUE_URL: !Ref OutboxDispatchQueue
                    AVATAR_REPOSITORY_BACKEND: !Ref AvatarRepositoryBackend
                    DYNAMODB_AVATAR_TABLE: !Ref DynamoDbAvatarTable
                    OUTBOX_CRON_ENABLED: false
                    OUTBOX_DISPATCH_BATCH_SIZE: 10
            Policies:
                - SQSSendMessagePolicy:
                      QueueName: !GetAtt OutboxDispatchQueue.QueueName
                - DynamoDBReadPolicy:
                      TableName: !Ref DynamoDbAvatarTable
            Events:
                OutboxDispatchSchedule:
                    Type: Schedule
                    Properties:
                        Schedule: !Ref OutboxDispatchScheduleExpression
                        Name: !Sub "${AWS::StackName}-OutboxDispatchSchedule"
                        Enabled: true

Outputs:
    ApiUrl:
        Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
    OutboxQueueUrl:
        Value: !Ref OutboxDispatchQueue
    AvatarTableName:
        Value: !Ref DynamoDbAvatarTable
