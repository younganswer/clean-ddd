type: object
required: [paymentId, status, scheduled]
properties:
    paymentId:
        type: string
    status:
        type: string
        enum: [PENDING, SUCCEEDED, FAILED]
    scheduled:
        type: object
        required: [eventType, delaySeconds, outboxId]
        properties:
            eventType:
                type: string
            delaySeconds:
                type: integer
                minimum: 0
            outboxId:
                type: string
