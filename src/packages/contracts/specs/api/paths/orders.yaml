get:
    summary: List orders
    parameters:
        - in: query
          name: limit
          schema:
              type: integer
              default: 20
              minimum: 1
              maximum: 50
        - in: query
          name: page
          schema:
              type: integer
              default: 1
              minimum: 1
    responses:
        "200":
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/PaginatedOrdersEnvelope"
post:
    summary: Create order
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../components.yaml#/schemas/CreateOrderRequest"
    responses:
        "201":
            description: Created
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/CreateOrderResponseEnvelope"
