type: object
required: [userId, amount, currency]
properties:
    userId:
        type: string
        format: uuid
    amount:
        type: number
        exclusiveMinimum: 0
    currency:
        type: string
    items:
        type: array
        items:
            $ref: "../../components.yaml#/schemas/OrderItem"
    simulateOutcome:
        type: string
        enum: [SUCCEEDED, FAILED]
    simulateDelaySeconds:
        type: integer
        minimum: 0
