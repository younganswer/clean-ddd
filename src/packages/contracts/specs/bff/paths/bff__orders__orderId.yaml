get:
    summary: Get order (BFF)
    parameters:
        - in: path
          name: orderId
          required: true
          schema:
              type: string
    responses:
        "200":
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/OrderEnvelope"
        "404":
            description: Not Found
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/ErrorEnvelope"
