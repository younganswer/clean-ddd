get:
    summary: Get relationship graph (BFF)
    parameters:
        - in: query
          name: rootType
          required: true
          schema:
              type: string
              enum: [USER, ORDER, SHIPMENT, PAYMENT]
        - in: query
          name: rootId
          required: true
          schema:
              type: string
        - in: query
          name: depth
          required: false
          schema:
              type: integer
              minimum: 0
              maximum: 4
        - in: query
          name: maxEvents
          required: false
          schema:
              type: integer
              minimum: 0
              maximum: 2000
        - in: query
          name: maxNodes
          required: false
          schema:
              type: integer
              minimum: 1
              maximum: 2000
        - in: query
          name: includeEvents
          required: false
          schema:
              type: boolean
    responses:
        "200":
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/GraphEnvelope"
        "404":
            description: Not Found
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/ErrorEnvelope"
