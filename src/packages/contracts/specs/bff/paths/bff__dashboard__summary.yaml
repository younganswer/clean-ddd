get:
    summary: Get dashboard summary
    parameters:
        - in: query
          name: limit
          required: false
          schema:
              type: integer
              default: 10
              minimum: 1
              maximum: 50
    responses:
        "200":
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/DashboardSummaryEnvelope"
        "500":
            description: Internal Server Error
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/ErrorEnvelope"
