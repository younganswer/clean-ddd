get:
    summary: Get system concepts bootstrap data (BFF)
    parameters:
        - in: query
          name: limit
          required: false
          schema:
              type: integer
              default: 50
              minimum: 1
              maximum: 200
        - in: query
          name: page
          required: false
          schema:
              type: integer
              default: 1
              minimum: 1
    responses:
        "200":
            description: OK
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/SystemConceptsBootstrapEnvelope"
        "400":
            description: Bad Request
            content:
                application/json:
                    schema:
                        $ref: "../components.yaml#/schemas/ErrorEnvelope"
