map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Docker embedded DNS server (dynamic upstream resolution)
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

upstream backend_api {
  zone backend_api 64k;
  server backend-api:3000 resolve;
}

upstream frontend_app {
  zone frontend_app 64k;
  server frontend:8080 resolve;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    application/xml+rss
    text/javascript
    image/svg+xml;

  location = /healthz {
    return 200;
  }

  location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    proxy_pass http://frontend_app;
  }

  location /api/ {
    proxy_read_timeout 300s;
    proxy_pass http://backend_api;
  }

  # static export(trailingSlash: true) route normalization
  # ex) /users -> /users/
  location ~ ^/(graph|users|orders|shipments|inventory|system-concepts)$ {
    return 308 $scheme://$host$uri/;
  }

  location / {
    proxy_read_timeout 300s;
    proxy_pass http://frontend_app;
  }
}
