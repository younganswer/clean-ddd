services:
  localstack:
    image: localstack/localstack:3.2
    ports:
      - "${LOCALSTACK_PORT:-45666}:4566"
    env_file:
      - ../localstack/.env
    volumes:
      - ../localstack:/etc/localstack/init/ready.d

    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -sf http://localhost:4566/_localstack/health | grep -q sqs",
        ]
      interval: 5s
      timeout: 2s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-54322}:5432"
    environment:
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=app
      - POSTGRES_DB=clean_ddd
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=clean_ddd
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 20

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    env_file:
      - ../nginx/.env
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      FRONTEND_PORT: ${FRONTEND_PORT:-8080}
    depends_on:
      - frontend
      - backend-api

  frontend:
    build:
      context: ../..
      dockerfile: service/frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    env_file:
      - ../../service/frontend/.env
    environment:
      PORT: ${FRONTEND_PORT:-8080}
    expose:
      - "${FRONTEND_PORT:-8080}"

  backend-api:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    env_file:
      - ../../service/backend/.env
    environment:
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "true"
      OUTBOX_CRON_ENABLED: "false"
      OUTBOX_POLLING_ENABLED: "false"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_POOLED: postgresql://app:app@postgres:5432/clean_ddd
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  backend-cron:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    env_file:
      - ../../service/backend/.env
    environment:
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "false"
      OUTBOX_CRON_ENABLED: "true"
      OUTBOX_POLLING_ENABLED: "false"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_POOLED: postgresql://app:app@postgres:5432/clean_ddd
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  backend-queue:
    build:
      context: ../..
      dockerfile: service/backend/Dockerfile
      target: prod
    env_file:
      - ../../service/backend/.env
    environment:
      PORT: ${BACKEND_PORT:-3000}
      PORT_LISTEN: "false"
      OUTBOX_CRON_ENABLED: "false"
      OUTBOX_POLLING_ENABLED: "true"
      DATABASE_URL: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_DIRECT: postgresql://app:app@postgres:5432/clean_ddd
      DATABASE_URL_POOLED: postgresql://app:app@postgres:5432/clean_ddd
      SQS_ENDPOINT: http://localstack:4566
      SQS_OUTBOX_QUEUE_URL: http://localstack:4566/000000000000/OutboxDispatchQueue.fifo
      MONGODB_URL: mongodb://mongodb:27017
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
