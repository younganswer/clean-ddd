openapi: 3.0.3
info:
  title: clean-ddd API
  version: 0.0.1
servers:
  - url: /api/v1
paths:
  /orders:
    get:
      summary: List orders
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: OK
    post:
      summary: Create order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency]
              properties:
                amount:
                  type: integer
                  minimum: 1
                currency:
                  type: string
                  enum: [KRW, USD]
      responses:
        "200":
          description: OK
  /orders/{id}:
    get:
      summary: Get order
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /orders/{orderId}/payments/intents:
    post:
      summary: Create payment intent (simulator)
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                simulateOutcome:
                  type: string
                  enum: [SUCCEEDED, FAILED]
                simulateDelaySeconds:
                  type: string
      responses:
        "200":
          description: OK
